name: Update IDX stock data

on:
  schedule:
    # 09:30 UTC = 16:30 WIB, ~30 menit setelah bursa IDX tutup (hari kerja)
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {} # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data terbaru
        run: python scripts/fetch_idx_data.py

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name "idx-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "chore: update data IDX $(date -u +%Y-%m-%d)"
          git push
